<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animated dashboard loop</title>
<style>
:root{--bg:#0b0d12;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--tx:#f2f4f8;--mut:#8b93a3;--y:#f4d35e;--g:#3ee08f;--p:#e254c8;--b:#4cc3ff;--r:#ff6b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--tx);padding:0}
.frame{width:min(920px,100%);padding:14px;border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.panel{background:#10131a;border-radius:18px;padding:18px;border:1px solid var(--line)}
.top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.kpi small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}
.kpi b{font-size:clamp(15px,2.6vw,22px);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:2.2fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.box h4{margin:0 0 8px;font-size:12px;color:var(--mut);font-weight:500}
svg{width:100%;height:auto;display:block}
.side{display:flex;flex-direction:column;gap:12px}
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow 6s cubic-bezier(.2,.8,.2,1) infinite}
.bar.n{fill:var(--y)}.bar.p{fill:var(--p)}.bar.b{fill:var(--b)}
@keyframes grow{0%{transform:scaleY(0)}18%,88%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.ln{fill:none;stroke:var(--g);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 6s ease-in-out infinite}
@keyframes draw{0%,10%{stroke-dashoffset:1}45%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.dot{fill:var(--g);opacity:0;animation:pop 6s infinite}
@keyframes pop{0%,40%{opacity:0}48%,88%{opacity:1}100%{opacity:0}}
.lbl{fill:var(--mut);font-size:9px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr 1fr}.top .kpi:last-child{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){.bar,.ln,.dot{animation:none;transform:none;stroke-dashoffset:0;opacity:1}}
</style>
</head>
<body>
<div class="frame"><div class="panel">
 <div class="top">
  <div class="kpi"><small>Ending cash balance</small><b id="k1">$0</b></div>
  <div class="kpi"><small>Monthly net burn</small><b id="k2">$0</b></div>
  <div class="kpi"><small>Runway</small><b id="k3">0 months</b></div>
 </div>
 <div class="grid">
  <div class="box"><h4>Net burn and cash contributions</h4>
   <svg viewBox="0 0 520 220" role="img" aria-label="Animated bar and line chart">
    <g stroke="rgba(255,255,255,.08)"><line x1="30" x2="510" y1="40" y2="40"/><line x1="30" x2="510" y1="100" y2="100"/><line x1="30" x2="510" y1="160" y2="160"/><line x1="30" x2="510" y1="200" y2="200"/></g>
    <g id="bars"></g>
    <path id="line" class="ln" pathLength="1"/>
    <g id="dots"></g>
   </svg></div>
  <div class="side">
   <div class="box"><h4>Spending</h4>
    <svg viewBox="0 0 200 70"><g id="b2"></g></svg></div>
   <div class="box"><h4>Revenue</h4>
    <svg viewBox="0 0 200 70"><g id="b3"></g></svg></div>
  </div>
 </div>
</div></div>
<script>
var ns="http://www.w3.org/2000/svg";
function el(t,a,p){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var vals=[150,110,90,120,100,135,70],mo=["Jan","Feb","Mar","Apr","May","Jun","Jul"],pts=[];
var bars=document.getElementById("bars"),dots=document.getElementById("dots");
vals.forEach(function(v,i){var x=50+i*68;
 var r=el("rect",{x:x,y:200-v,width:30,height:v,rx:2,"class":"bar n"},bars);r.style.animationDelay=(i*.08)+"s";
 if(i==6)r.setAttribute("opacity",".55");
 el("text",{x:x+15,y:214,"text-anchor":"middle","class":"lbl"},bars).textContent=mo[i];
 var y=200-(v*.55+40+(i%2?20:0));pts.push([x+15,y]);
 var d=el("circle",{cx:x+15,cy:y,r:3.5,"class":"dot"},dots);d.style.animationDelay=(i*.08)+"s"});
document.getElementById("line").setAttribute("d","M"+pts.map(function(p){return p.join(",")}).join(" L"));
function mini(id,c,hs,w){var g=document.getElementById(id);hs.forEach(function(h,i){
 var r=el("rect",{x:6+i*w,y:66-h,width:w*.6,height:h,rx:2,"class":"bar "+c},g);r.style.animationDelay=(i*.07)+"s"})}
mini("b2","p",[20,45,30,55,25,40,50,28,35,48],19);
mini("b3","b",[15,25,35,30,45,40,55,50,60,52],19);
function count(id,to,fmt,ms){var e=document.getElementById(id),t0=null;
 function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/ms,1),v=to*(1-Math.pow(1-p,3));e.textContent=fmt(v);if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
function run(){
 count("k1",1203610,function(v){return"$"+Math.round(v).toLocaleString("en-US")},1800);
 count("k2",20000,function(v){return"($"+Math.round(v).toLocaleString("en-US")+")"},1800);
 count("k3",14,function(v){return Math.round(v)+" months"},1800)}
run();setInterval(run,6000);
</script>
</body>
</html>
